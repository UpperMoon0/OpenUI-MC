plugins { id 'com.gradleup.shadow' }
architectury { platformSetupLoomIde(); fabric() }

configurations {
    common { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}

dependencies {
    api project(':common-1.20.1')
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version_1_20_1}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version_1_20_1}"
    common(project(path: ':common-1.20.1', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common-1.20.1', configuration: 'transformProductionFabric')
}

processResources {
    from(rootProject.file('logo.png')) { rename { 'openui_mc.png' } }
    def metadata = [
        version: project.version,
        mod_id: rootProject.mod_id,
        mod_name: rootProject.mod_name,
        mod_description: rootProject.mod_description,
        mod_authors: rootProject.mod_authors,
        mod_license: rootProject.mod_license
    ]
    inputs.properties metadata
    filesMatching('fabric.mod.json') { expand metadata }
}
shadowJar { configurations = [project.configurations.shadowBundle]; archiveClassifier = 'dev-shadow' }
remapJar { inputFile.set shadowJar.archiveFile }
