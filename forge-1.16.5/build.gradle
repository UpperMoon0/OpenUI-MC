plugins { id 'java-library'; id 'net.minecraftforge.gradle' version '6.0.54'; id 'maven-publish' }
group='com.nstut'; version=mod_version
base { archivesName='openui-mc-forge-1.16.5' }
java { toolchain.languageVersion=JavaLanguageVersion.of(17); sourceCompatibility=JavaVersion.VERSION_1_8; targetCompatibility=JavaVersion.VERSION_1_8; withSourcesJar() }
repositories { mavenCentral() }
dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'
    annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:0.4.2'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
minecraft {
    mappings channel:'official',version:'1.16.5'
    runs {
        client { workingDirectory project.file('run'); mods { openui_mc { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { openui_mc { source sourceSets.main } } }
    }
}
tasks.register('generateLegacySources',Exec) {
    inputs.dir '../shared/core/src/main/java'; inputs.dir '../common-1.20.1/src/main/java'; inputs.file '../tools/legacy_sources.py'
    outputs.dir layout.buildDirectory.dir('generated/openui')
    commandLine 'python', '../tools/legacy_sources.py','--output',layout.buildDirectory.dir('generated/openui').get().asFile
}
sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/openui')
compileJava {
    dependsOn 'generateLegacySources'
    sourceCompatibility=JavaVersion.VERSION_17
    options.release=8
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
test { useJUnitPlatform() }
tasks.register('testSourceGenerator', Exec) { workingDir '..'; commandLine 'python','-m','unittest','discover','-s','tools','-p','test_legacy_sources.py' }
tasks.named('check') { dependsOn 'testSourceGenerator' }
processResources { from('../logo.png') { rename { 'openui_mc.png' } }; from('../LICENSE'); filesMatching('META-INF/mods.toml') { expand version:project.version } }
jar { finalizedBy 'reobfJar' }
publishing {
    publications { mavenJava(MavenPublication) { artifactId=base.archivesName.get(); artifact tasks.named("jar"); artifact tasks.named("sourcesJar") } }
    repositories { maven {
        name='GitHubPackages'; url=uri('https://maven.pkg.github.com/UpperMoon0/OpenUI-MC')
        credentials { username=System.getenv('GITHUB_ACTOR'); password=System.getenv('GITHUB_TOKEN') }
    } }
}

compileTestJava { options.release=8 }
test { javaLauncher=javaToolchains.launcherFor { languageVersion=JavaLanguageVersion.of(8) } }

tasks.named('sourcesJar') { dependsOn 'generateLegacySources' }
