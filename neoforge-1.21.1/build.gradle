plugins { id 'com.gradleup.shadow' }
architectury { platformSetupLoomIde(); neoForge() }

configurations {
    common { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}

repositories { maven { url = 'https://maven.neoforged.net/releases' } }
dependencies {
    api project(':common-1.21.1')
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version_1_21_1}"
    common(project(path: ':common-1.21.1', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common-1.21.1', configuration: 'transformProductionNeoForge')
}

processResources {
    def metadata = [
        version: project.version,
        mod_id: rootProject.mod_id,
        mod_name: rootProject.mod_name,
        mod_description: rootProject.mod_description,
        mod_authors: rootProject.mod_authors,
        mod_license: rootProject.mod_license
    ]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') { expand metadata }
}
shadowJar { configurations = [project.configurations.shadowBundle]; archiveClassifier = 'dev-shadow' }
remapJar { inputFile.set shadowJar.archiveFile }
