plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury { minecraft = minecraft_version_1_20_1 }

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    if (project.name == 'neoforge-26.1.2') {
        return
    }
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    def mc21 = project.name.contains('1.21.1')
    def mcVersion = mc21 ? rootProject.minecraft_version_1_21_1 : rootProject.minecraft_version_1_20_1

    base { archivesName = "${rootProject.archives_name}-${project.name}" }
    loom { silentMojangMappingsLicense() }

    dependencies {
        minecraft "net.minecraft:minecraft:${mcVersion}"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()
        sourceCompatibility = mc21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
        targetCompatibility = mc21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = mc21 ? 21 : 17
        options.encoding = 'UTF-8'
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/UpperMoon0/OpenUI-MC')
                credentials {
                    username = System.getenv('GITHUB_ACTOR') ?: findProperty('gpr.user')
                    password = System.getenv('GITHUB_TOKEN') ?: findProperty('gpr.key')
                }
            }
        }
    }
}

tasks.register('checkBinaryApiCompatibility') {
    group = 'verification'
    description = 'Checks the Fabric 1.20.1 public JVM API against the released 0.0.7 compatibility baseline.'
    dependsOn ':fabric-1.20.1:remapJar'
    doLast {
        def candidate = project(':fabric-1.20.1').tasks.named('remapJar').get().archiveFile.get().asFile
        def report = layout.buildDirectory.file('reports/binary-api-compatibility.txt').get().asFile
        report.parentFile.mkdirs()
        exec {
            commandLine 'python3', file('tools/check_binary_api.py'),
                    '--baseline-url', 'https://github.com/UpperMoon0/OpenUI-MC/releases/download/v0.0.7/openui-mc-fabric-1.20.1-0.0.7.jar',
                    '--candidate', candidate,
                    '--report', report
        }
    }
}

// Reuse the normal Fabric 1.20.1 build in CI as the binary-compatibility gate;
// this adds no second candidate build and publishes the report into the Actions summary.
gradle.projectsEvaluated {
    if (System.getenv('CI') == 'true') {
        project(':fabric-1.20.1').tasks.named('build').configure {
            finalizedBy rootProject.tasks.named('checkBinaryApiCompatibility')
        }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds every supported Minecraft version and loader.'
    dependsOn ':fabric-1.20.1:build', ':forge-1.20.1:build',
        ':fabric-1.21.1:build', ':neoforge-1.21.1:build',
        ':neoforge-26.1.2:build'
}

tasks.register('testAllVersions') {
    group = 'verification'
    dependsOn 'checkLegacySourceParity', ':common-1.20.1:test', ':common-1.21.1:test', ':neoforge-26.1.2:test'
}

tasks.register('checkLegacySourceParity') {
    group = 'verification'
    description = 'Prevents the shared 1.20.1/1.21.1 implementation from drifting outside explicit API adapters.'
    doLast {
        def leftRoot = file('common-1.20.1/src/main/java')
        def rightRoot = file('common-1.21.1/src/main/java')
        def allowedDifferences = [
            'com/nstut/openui/api/EditBoxWrapper.java',
            'com/nstut/openui/minecraft/UiContainerScreen.java',
            'com/nstut/openui/minecraft/UiScreen.java'
        ] as Set
        def relativeFiles = { File root ->
            fileTree(root).matching { include '**/*.java' }.files.collect {
                root.toPath().relativize(it.toPath()).toString().replace('\\', '/')
            } as Set
        }
        def leftFiles = relativeFiles(leftRoot)
        def rightFiles = relativeFiles(rightRoot)
        def unexpected = []
        (leftFiles + rightFiles).sort().each { path ->
            if (allowedDifferences.contains(path)) return
            def left = new File(leftRoot, path)
            def right = new File(rightRoot, path)
            if (!left.isFile() || !right.isFile() || !java.util.Arrays.equals(left.bytes, right.bytes)) {
                unexpected << path
            }
        }
        if (!unexpected.isEmpty()) {
            throw new GradleException("Legacy shared-source parity drift:\n - " + unexpected.join('\n - '))
        }
    }
}
