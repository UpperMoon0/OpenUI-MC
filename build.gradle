plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury { minecraft = minecraft_version_1_20_1 }

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    def mc21 = project.name.contains('1.21.1')
    def mcVersion = mc21 ? rootProject.minecraft_version_1_21_1 : rootProject.minecraft_version_1_20_1

    base { archivesName = "${rootProject.archives_name}-${project.name}" }
    loom { silentMojangMappingsLicense() }

    dependencies {
        minecraft "net.minecraft:minecraft:${mcVersion}"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()
        sourceCompatibility = mc21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
        targetCompatibility = mc21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = mc21 ? 21 : 17
        options.encoding = 'UTF-8'
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds every supported Minecraft version and loader.'
    dependsOn ':fabric-1.20.1:build', ':forge-1.20.1:build',
        ':fabric-1.21.1:build', ':neoforge-1.21.1:build'
}

tasks.register('testAllVersions') {
    group = 'verification'
    dependsOn ':common-1.20.1:test', ':common-1.21.1:test'
}

