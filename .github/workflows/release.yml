name: Build and Release OpenUI MC

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Check release trigger
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for version bump
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          should_release=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF" == refs/tags/v* ]]; then
            should_release=true
          elif [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/main" ]]; then
            current="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
            previous="$(git show "$BEFORE":gradle.properties 2>/dev/null | sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' | head -n1 | tr -d '\r' | xargs || true)"
            if [[ -n "$current" && "$current" != "$previous" ]]; then
              should_release=true
            fi
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "Release trigger: $should_release"

  test-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew checkLegacySourceParity :common-1.20.1:test :common-1.21.1:test

  consumer-binary-smoke:
    name: Simply Speakers 0.0.7 binary compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout OpenUI 0.0.8 candidate
        uses: actions/checkout@v4
        with:
          path: openui-candidate
      - name: Checkout OpenUI 0.0.7 baseline
        uses: actions/checkout@v4
        with:
          repository: UpperMoon0/OpenUI-MC
          ref: 82a5dd2f0e6c6027f20ca2acf049858f7f96f597
          path: openui-baseline
      - name: Checkout precompiled consumer source
        uses: actions/checkout@v4
        with:
          repository: UpperMoon0/Simply-Speakers
          ref: 9a9681671e783bfd6e80594c3e23a76fb7132efb
          path: simply-speakers
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install virtual display
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends xvfb
      - name: Make Gradle wrappers executable
        run: chmod +x openui-baseline/gradlew openui-candidate/gradlew simply-speakers/gradlew
      - name: Limit compatibility fixture to Fabric 1.20.1
        shell: bash
        run: |
          for settings in openui-baseline/settings.gradle openui-candidate/settings.gradle; do
            sed -i \
              -e "/include 'forge-1.20.1'/d" \
              -e "/include 'common-1.21.1'/d" \
              -e "/include 'fabric-1.21.1'/d" \
              -e "/include 'neoforge-1.21.1'/d" \
              -e "/include 'neoforge-26.1.2'/d" \
              "$settings"
          done
          sed -i \
            -e "/include 'forge-1.20.1'/d" \
            -e "/include 'common-1.21.1'/d" \
            -e "/include 'fabric-1.21.1'/d" \
            -e "/include 'neoforge-1.21.1'/d" \
            -e "/include 'neoforge-26.1.2'/d" \
            simply-speakers/settings.gradle
      - name: Compile consumer against OpenUI 0.0.7
        shell: bash
        run: |
          ./openui-baseline/gradlew -p openui-baseline \
            :common-1.20.1:publishToMavenLocal \
            :fabric-1.20.1:publishToMavenLocal --no-daemon
          ./simply-speakers/gradlew -p simply-speakers \
            :fabric-1.20.1:classes --no-daemon
      - name: Install OpenUI 0.0.8 without recompiling consumer
        shell: bash
        run: |
          ./openui-candidate/gradlew -p openui-candidate \
            :common-1.20.1:publishToMavenLocal \
            :fabric-1.20.1:publishToMavenLocal --no-daemon
          sed -i 's/^openui_version[[:space:]]*=.*/openui_version = 0.0.8/' simply-speakers/gradle.properties
          sed -i '/"-Dorg.gradle.jvmargs=-Xmx2048m",/a\        "-x", ":common-1.20.1:compileJava", "-x", ":fabric-1.20.1:compileJava",' \
            simply-speakers/tools/live_join_test.py
      - name: Add CC:Tweaked API shim for optional linkage
        shell: bash
        run: |
          # Simply Speakers has an optional ComputerCraft integration.  Its
          # entrypoint references the CC ABI even when the real mod is absent,
          # so provide only the ABI classes needed for class loading.  Giving
          # the shim a different mod id keeps FabricLoader.isModLoaded("computercraft")
          # false and avoids initializing the full ComputerCraft mod (which is
          # not part of this compatibility fixture).
          shim_root=/tmp/openui-cc-api-shim
          rm -rf "$shim_root"
          mkdir -p "$shim_root/src/dan200/computercraft/api/peripheral" \
            "$shim_root/classes"
          cat > "$shim_root/src/dan200/computercraft/api/peripheral/IPeripheral.java" <<'EOF'
          package dan200.computercraft.api.peripheral;
          public interface IPeripheral {}
          EOF
          cat > "$shim_root/src/dan200/computercraft/api/peripheral/IPeripheralProvider.java" <<'EOF'
          package dan200.computercraft.api.peripheral;
          public interface IPeripheralProvider {}
          EOF
          cat > "$shim_root/src/dan200/computercraft/api/peripheral/PeripheralLookup.java" <<'EOF'
          package dan200.computercraft.api.peripheral;
          import java.util.function.BiFunction;
          public final class PeripheralLookup {
            private static final PeripheralLookup INSTANCE = new PeripheralLookup();
            private PeripheralLookup() {}
            public static PeripheralLookup get() { return INSTANCE; }
            public void registerForBlockEntity(BiFunction<?, ?, ?> provider, Object blockEntityType) {}
          }
          EOF
          javac --release 17 -d "$shim_root/classes" $(find "$shim_root/src" -name '*.java')
          cat > "$shim_root/fabric.mod.json" <<'EOF'
          {"schemaVersion":1,"id":"openui_cc_api_shim","version":"1.0.0","name":"OpenUI CC API shim","environment":"*","depends":{"fabricloader":">=0.14","minecraft":"1.20.1"}}
          EOF
          jar --create --file "$shim_root/openui-cc-api-shim.jar" \
            -C "$shim_root/classes" . -C "$shim_root" fabric.mod.json
          mkdir -p simply-speakers/fabric-1.20.1/run/live-join/client/mods \
            simply-speakers/fabric-1.20.1/run/live-join/server/mods
          cp "$shim_root/openui-cc-api-shim.jar" \
            simply-speakers/fabric-1.20.1/run/live-join/client/mods/
          cp "$shim_root/openui-cc-api-shim.jar" \
            simply-speakers/fabric-1.20.1/run/live-join/server/mods/
      - name: Boot precompiled consumer with OpenUI 0.0.8
        working-directory: simply-speakers
        run: python3 tools/live_join_test.py --target fabric-1.20.1

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Loom's build tooling requires Java 21; the 1.20.1 modules still
          # compile and emit Java 17 bytecode through their Gradle toolchain.
          - java: 21
            version: '1.20.1'
            platform: fabric
            project: fabric-1.20.1
          - java: 21
            version: '1.20.1'
            platform: forge
            project: forge-1.20.1
          - java: 21
            version: '1.21.1'
            platform: fabric
            project: fabric-1.21.1
          - java: 21
            version: '1.21.1'
            platform: neoforge
            project: neoforge-1.21.1
          - java: 25
            version: '26.1.2'
            platform: neoforge
            project: neoforge-26.1.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - run: chmod +x gradlew
      - name: Test and Build ${{ matrix.platform }} ${{ matrix.version }}
        run: ./gradlew :${{ matrix.project }}:test :${{ matrix.project }}:build
      - uses: actions/upload-artifact@v4
        with:
          name: openui-mc-${{ matrix.platform }}-${{ matrix.version }}
          path: |
            ${{ matrix.project }}/build/libs/openui-mc-${{ matrix.project }}-*.jar
            !${{ matrix.project }}/build/libs/*-sources.jar
            !${{ matrix.project }}/build/libs/*-dev-shadow.jar
          if-no-files-found: error

  publish-curseforge:
    name: Publish ${{ matrix.platform }} ${{ matrix.version }} to CurseForge
    if: needs.release-gate.outputs.should_release == 'true'
    needs: [release-gate, test-common, consumer-binary-smoke, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.20.1'
            platform: fabric
            loader_name: Fabric
            java_version_name: Java 17
          - version: '1.20.1'
            platform: forge
            loader_name: Forge
            java_version_name: Java 17
          - version: '1.21.1'
            platform: fabric
            loader_name: Fabric
            java_version_name: Java 21
          - version: '1.21.1'
            platform: neoforge
            loader_name: NeoForge
            java_version_name: Java 21
          - version: '26.1.2'
            platform: neoforge
            loader_name: NeoForge
            java_version_name: Java 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openui-mc-${{ matrix.platform }}-${{ matrix.version }}
          path: curseforge-artifact
      - name: Select release jar and version
        id: release_file
        shell: bash
        run: |
          set -euo pipefail
          mod_version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          if [[ ! "$mod_version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            printf 'Invalid mod_version: %q\n' "$mod_version" >&2
            exit 1
          fi

          mapfile -t jars < <(find curseforge-artifact -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev-shadow.jar' | sort)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one runnable jar, found ${#jars[@]}" >&2
            printf '  %s\n' "${jars[@]}" >&2
            exit 1
          fi

          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "jar_path=${jars[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish to CurseForge
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: '1661978'
          MOD_VERSION: ${{ steps.release_file.outputs.mod_version }}
          CHANGELOG_PATH: changelog/${{ steps.release_file.outputs.mod_version }}.md
          JAR_PATH: ${{ steps.release_file.outputs.jar_path }}
          MINECRAFT_VERSION: ${{ matrix.version }}
          PLATFORM: ${{ matrix.platform }}
          LOADER_NAME: ${{ matrix.loader_name }}
          JAVA_VERSION_NAME: ${{ matrix.java_version_name }}
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_API_TOKEN:-}" ]]; then
            echo "Missing required GitHub secret: CURSEFORGE_API_TOKEN" >&2
            exit 1
          fi
          if [[ ! -f "$CHANGELOG_PATH" ]]; then
            echo "Missing release changelog: ${CHANGELOG_PATH}" >&2
            exit 1
          fi

          game_version_names="$(jq -cn \
            --arg minecraftVersion "$MINECRAFT_VERSION" \
            --arg loaderName "$LOADER_NAME" \
            --arg javaVersionName "$JAVA_VERSION_NAME" \
            '[$minecraftVersion, $loaderName, $javaVersionName, "Client"]')"

          available_versions="$(curl --fail-with-body --silent --show-error \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            'https://minecraft.curseforge.com/api/game/versions')"
          while IFS= read -r version_name; do
            if ! jq -e --arg name "$version_name" 'any(.[]; .name == $name)' \
              <<< "$available_versions" >/dev/null; then
              echo "CurseForge does not recognize game version tag: ${version_name}" >&2
              exit 1
            fi
          done < <(jq -r '.[]' <<< "$game_version_names")

          changelog="$(<"$CHANGELOG_PATH")"
          metadata="$(jq -cn \
            --arg changelog "$changelog" \
            --arg displayName "OpenUI MC ${MOD_VERSION} - ${LOADER_NAME} ${MINECRAFT_VERSION}" \
            --argjson gameVersionNames "$game_version_names" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersionNames: $gameVersionNames,
              releaseType: "release"
            }')"
          if [[ "$PLATFORM" == "fabric" ]]; then
            metadata="$(jq -c \
              '.relations = {projects: [{slug: "fabric-api", type: "requiredDependency"}]}' \
              <<< "$metadata")"
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            --form-string "metadata=${metadata}" \
            --form "file=@${JAR_PATH}" \
            "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file")"
          response="$(<"$response_file")"
          if [[ "$http_status" =~ ^2 ]]; then
            file_id="$(jq -er '.id' <<< "$response")"
            echo "Published ${JAR_PATH} to CurseForge as file ID ${file_id}."
          elif grep -Eqi 'already|duplicate' <<< "$response"; then
            echo "CurseForge already has ${JAR_PATH}; treating this retry as successful."
          else
            echo "CurseForge upload failed with HTTP ${http_status}: ${response}" >&2
            exit 1
          fi

  publish-github-release:
    name: Publish GitHub Release
    if: needs.release-gate.outputs.should_release == 'true'
    needs: [release-gate, test-common, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: OpenUI MC v${{ steps.version.outputs.value }}
          body_path: changelog/${{ steps.version.outputs.value }}.md
          fail_on_unmatched_files: true
          files: artifacts/**/*.jar
