name: Build and Release OpenUI MC

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew testAllVersions

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Loom's build tooling requires Java 21; the 1.20.1 modules still
          # compile and emit Java 17 bytecode through their Gradle toolchain.
          - java: 21
            version: '1.20.1'
            platform: fabric
            project: fabric-1.20.1
          - java: 21
            version: '1.20.1'
            platform: forge
            project: forge-1.20.1
          - java: 21
            version: '1.21.1'
            platform: fabric
            project: fabric-1.21.1
          - java: 21
            version: '1.21.1'
            platform: neoforge
            project: neoforge-1.21.1
          - java: 25
            version: '26.1.2'
            platform: neoforge
            project: neoforge-26.1.2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - run: chmod +x gradlew
      - name: Build ${{ matrix.platform }} ${{ matrix.version }}
        run: ./gradlew :${{ matrix.project }}:build
      - uses: actions/upload-artifact@v7
        with:
          name: openui-mc-${{ matrix.platform }}-${{ matrix.version }}
          path: |
            ${{ matrix.project }}/build/libs/openui-mc-${{ matrix.project }}-*.jar
            !${{ matrix.project }}/build/libs/*-sources.jar
            !${{ matrix.project }}/build/libs/*-dev-shadow.jar
          if-no-files-found: error

  publish-curseforge:
    name: Publish ${{ matrix.platform }} ${{ matrix.version }} to CurseForge
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.20.1'
            platform: fabric
            loader_name: Fabric
            java_version_name: Java 17
          - version: '1.20.1'
            platform: forge
            loader_name: Forge
            java_version_name: Java 17
          - version: '1.21.1'
            platform: fabric
            loader_name: Fabric
            java_version_name: Java 21
          - version: '1.21.1'
            platform: neoforge
            loader_name: NeoForge
            java_version_name: Java 21
          - version: '26.1.2'
            platform: neoforge
            loader_name: NeoForge
            java_version_name: Java 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: openui-mc-${{ matrix.platform }}-${{ matrix.version }}
          path: curseforge-artifact
      - name: Select release jar and version
        id: release_file
        shell: bash
        run: |
          set -euo pipefail
          mod_version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          if [[ ! "$mod_version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            printf 'Invalid mod_version: %q\n' "$mod_version" >&2
            exit 1
          fi

          mapfile -t jars < <(find curseforge-artifact -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev-shadow.jar' | sort)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one runnable jar, found ${#jars[@]}" >&2
            printf '  %s\n' "${jars[@]}" >&2
            exit 1
          fi

          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "jar_path=${jars[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish to CurseForge
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: '1661978'
          MOD_VERSION: ${{ steps.release_file.outputs.mod_version }}
          CHANGELOG_PATH: changelog/${{ steps.release_file.outputs.mod_version }}.md
          JAR_PATH: ${{ steps.release_file.outputs.jar_path }}
          MINECRAFT_VERSION: ${{ matrix.version }}
          PLATFORM: ${{ matrix.platform }}
          LOADER_NAME: ${{ matrix.loader_name }}
          JAVA_VERSION_NAME: ${{ matrix.java_version_name }}
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_API_TOKEN:-}" ]]; then
            echo "Missing required GitHub secret: CURSEFORGE_API_TOKEN" >&2
            exit 1
          fi
          if [[ ! -f "$CHANGELOG_PATH" ]]; then
            echo "Missing release changelog: ${CHANGELOG_PATH}" >&2
            exit 1
          fi

          game_version_names="$(jq -cn \
            --arg minecraftVersion "$MINECRAFT_VERSION" \
            --arg loaderName "$LOADER_NAME" \
            --arg javaVersionName "$JAVA_VERSION_NAME" \
            '[$minecraftVersion, $loaderName, $javaVersionName, "Client"]')"

          available_versions="$(curl --fail-with-body --silent --show-error \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            'https://minecraft.curseforge.com/api/game/versions')"
          while IFS= read -r version_name; do
            if ! jq -e --arg name "$version_name" 'any(.[]; .name == $name)' \
              <<< "$available_versions" >/dev/null; then
              echo "CurseForge does not recognize game version tag: ${version_name}" >&2
              exit 1
            fi
          done < <(jq -r '.[]' <<< "$game_version_names")

          changelog="$(<"$CHANGELOG_PATH")"
          metadata="$(jq -cn \
            --arg changelog "$changelog" \
            --arg displayName "OpenUI MC ${MOD_VERSION} - ${LOADER_NAME} ${MINECRAFT_VERSION}" \
            --argjson gameVersionNames "$game_version_names" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersionNames: $gameVersionNames,
              releaseType: "release"
            }')"
          if [[ "$PLATFORM" == "fabric" ]]; then
            metadata="$(jq -c \
              '.relations = {projects: [{slug: "fabric-api", type: "requiredDependency"}]}' \
              <<< "$metadata")"
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            --form-string "metadata=${metadata}" \
            --form "file=@${JAR_PATH}" \
            "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file")"
          response="$(<"$response_file")"
          if [[ "$http_status" =~ ^2 ]]; then
            file_id="$(jq -er '.id' <<< "$response")"
            echo "Published ${JAR_PATH} to CurseForge as file ID ${file_id}."
          elif grep -Eqi 'already|duplicate' <<< "$response"; then
            echo "CurseForge already has ${JAR_PATH}; treating this retry as successful."
          else
            echo "CurseForge upload failed with HTTP ${http_status}: ${response}" >&2
            exit 1
          fi

  publish-github-release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: OpenUI MC v${{ steps.version.outputs.value }}
          body_path: changelog/${{ steps.version.outputs.value }}.md
          fail_on_unmatched_files: true
          files: artifacts/**/*.jar
