name: Build and Release OpenUI MC

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew testAllVersions

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 17
            version: '1.20.1'
            platform: fabric
            project: fabric-1.20.1
          - java: 17
            version: '1.20.1'
            platform: forge
            project: forge-1.20.1
          - java: 21
            version: '1.21.1'
            platform: fabric
            project: fabric-1.21.1
          - java: 21
            version: '1.21.1'
            platform: neoforge
            project: neoforge-1.21.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - run: chmod +x gradlew
      - name: Build ${{ matrix.platform }} ${{ matrix.version }}
        run: ./gradlew :${{ matrix.project }}:build
      - uses: actions/upload-artifact@v4
        with:
          name: openui-mc-${{ matrix.platform }}-${{ matrix.version }}
          path: |
            ${{ matrix.project }}/build/libs/openui-mc-${{ matrix.project }}-*.jar
            !${{ matrix.project }}/build/libs/*-sources.jar
            !${{ matrix.project }}/build/libs/*-dev-shadow.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: OpenUI MC v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: artifacts/**/*.jar

  # CurseForge publishing intentionally remains disabled until an OpenUI MC
  # project ID and API token are available.
