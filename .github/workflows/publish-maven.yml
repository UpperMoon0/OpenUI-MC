name: Publish OpenUI Maven packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: fabric-1.20.1
            java: 21
          - project: forge-1.20.1
            java: 21
          - project: fabric-1.21.1
            java: 21
          - project: neoforge-1.21.1
            java: 21
          - project: neoforge-26.1.2
            java: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
          fetch-depth: 0
      - name: Verify exact main target and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          git fetch origin main --force
          main_sha="$(git rev-parse origin/main)"

          if [[ "$target_sha" != "$main_sha" ]]; then
            echo "Refusing to publish: target $target_sha is not current main $main_sha" >&2
            exit 1
          fi

          if [[ -n "$RELEASE_TAG" ]]; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tag_sha" != "$target_sha" ]]; then
              echo "Refusing to publish: release tag $RELEASE_TAG resolves to $tag_sha, expected $target_sha" >&2
              exit 1
            fi
          fi

          runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${target_sha}&status=completed&per_page=100")"
          if ! jq -e '.workflow_runs | any(.name == "Build and Release OpenUI MC" and .conclusion == "success")' <<<"$runs" >/dev/null; then
            echo "Refusing to publish: no successful Build and Release OpenUI MC run exists for $target_sha" >&2
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - run: chmod +x gradlew
      - name: Verify and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :${{ matrix.project }}:test :${{ matrix.project }}:build \
            :${{ matrix.project }}:publishMavenJavaPublicationToGitHubPackagesRepository \
            --no-daemon
