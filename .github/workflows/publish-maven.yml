name: Publish OpenUI Maven packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: fabric-1.20.1
            java: 21
          - project: forge-1.20.1
            java: 21
          - project: fabric-1.21.1
            java: 21
          - project: neoforge-1.21.1
            java: 21
          - project: neoforge-26.1.2
            java: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - run: chmod +x gradlew
      - name: Verify and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :${{ matrix.project }}:test :${{ matrix.project }}:build \
            :${{ matrix.project }}:publishMavenJavaPublicationToGitHubPackagesRepository \
            --no-daemon
