plugins { id 'java-library'; id 'maven-publish'; id 'net.neoforged.moddev' version '2.0.148' }
base { archivesName='openui-mc-neoforge-26.2' }

def rootProperties = new Properties()
file('../gradle.properties').withInputStream { rootProperties.load(it) }
group = rootProperties.getProperty('maven_group')
version = rootProperties.getProperty('mod_version')
java { toolchain.languageVersion=JavaLanguageVersion.of(25); withSourcesJar() }
repositories { mavenCentral() }
sourceSets {
    main { java.srcDirs '../shared/core/src/main/java', '../common-26.2/src/main/java'; resources.srcDir '../common-26.2/src/main/resources' }
    test { java.srcDir '../common-26.2/src/test/java' }
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.release=25; options.encoding='UTF-8' }
processResources { from('../logo.png') { rename { 'openui_mc.png' } }; from('../LICENSE') }
publishing { publications { mavenJava(MavenPublication) { artifactId=base.archivesName.get(); from components.java } } }

neoForge {
    version='26.2.0.93'
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { openui_mc { sourceSet(sourceSets.main) } }
}
processResources { inputs.property 'version', project.version; filesMatching('META-INF/neoforge.mods.toml') { expand version:project.version } }

publishing.repositories.maven {
    name='GitHubPackages';url=uri('https://maven.pkg.github.com/UpperMoon0/OpenUI-MC')
    credentials { username=System.getenv('GITHUB_ACTOR');password=System.getenv('GITHUB_TOKEN') }
}
